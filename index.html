<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeee9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>이번 달 날 수</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px 16px 40px; background:#efeee9; color:#1a1a1c;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width:460px; margin:0 auto; }
  .card { background:#fff; border-radius:18px; padding:20px; margin-bottom:12px; }
  h2 { font-size:12px; margin:0 0 14px; color:#a3a39a; font-weight:700; letter-spacing:.06em; }

  .burn { text-align:center; padding:6px 0 4px; }
  .burn .n { font-size:60px; font-weight:800; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .burn .n.over { color:#b0492f; }
  .burn .n.good { color:#2e6b52; }
  .burn .u { font-size:13px; color:#a3a39a; margin-top:9px; }

  .split { display:flex; margin:20px 0 14px; }
  .split div { flex:1; text-align:center; }
  .split span { display:block; font-size:11px; color:#a3a39a; margin-bottom:5px; }
  .split b { font-size:20px; font-variant-numeric:tabular-nums; }
  .split .out b { color:#b0492f; }
  .split .in b { color:#2e6b52; }
  .split .day b { color:#1a1a1c; }

  .track { height:10px; background:#f3f2ee; border-radius:6px; margin:0 0 12px; overflow:hidden; }
  .track .fill { height:100%; background:#1a1a1c; border-radius:6px; transition:width .2s; }
  .track .fill.over { background:#b0492f; }
  .verdict { font-size:13px; text-align:center; color:#a3a39a; line-height:1.7; }
  .verdict b { color:#1a1a1c; }
  .verdict.over b { color:#b0492f; }
  .verdict.good b { color:#2e6b52; }

  .seg { display:flex; background:#f3f2ee; border-radius:11px; padding:3px; margin-bottom:12px; }
  .seg button { flex:1; padding:11px 0; font-size:15px; font-weight:700; font-family:inherit;
    background:none; border:0; border-radius:9px; color:#a3a39a; cursor:pointer; }
  .seg button.on { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .seg button.on[data-k="out"] { color:#b0492f; }
  .seg button.on[data-k="in"] { color:#2e6b52; }

  .frow { display:flex; gap:8px; }
  .frow input { padding:12px; font-size:16px; border:1px solid #e2e0d9; border-radius:11px;
    background:#fafaf7; font-family:inherit; color:#1a1a1c; min-width:0; flex:1; }
  .frow input.n { width:92px; flex:none; text-align:right; font-weight:700; }
  .frow input:focus { outline:none; border-color:#1a1a1c; }
  .quick { display:flex; gap:8px; margin-bottom:10px; }
  .quick button { flex:1; padding:10px 0; font-size:14px; font-weight:600; font-family:inherit;
    background:#f3f2ee; border:0; border-radius:10px; color:#57574f; cursor:pointer; }
  .prev { font-size:13px; color:#a3a39a; text-align:center; min-height:19px; margin-top:10px; }
  .prev b { color:#b0492f; } .prev b.g { color:#2e6b52; }
  button.main { width:100%; padding:14px; font-size:15px; font-weight:700; font-family:inherit;
    background:#1a1a1c; color:#fff; border:0; border-radius:12px; cursor:pointer; margin-top:10px; }
  button.main:disabled { background:#d9d7d0; }
  button.ghost { width:100%; padding:13px; font-size:14px; font-weight:600; font-family:inherit;
    background:#fff; color:#57574f; border:1px solid #e2e0d9; border-radius:11px; cursor:pointer; margin-bottom:8px; }

  .item { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #f4f3ef; }
  .item:last-child { border-bottom:0; }
  .it-main { flex:1; min-width:0; }
  .it-t { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it-d { font-size:12px; color:#b5b5ad; margin-top:3px; }
  .it-n { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .it-n.m { color:#b0492f; } .it-n.p { color:#2e6b52; }
  .x { border:0; background:none; color:#c8c6c0; font-size:20px; padding:0 2px; cursor:pointer; font-family:inherit; }
  .empty { font-size:14px; color:#b5b5ad; text-align:center; padding:12px 0; }

  .hist { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f4f3ef; font-size:14px; }
  .hist:last-child { border-bottom:0; }
  .hist b { font-variant-numeric:tabular-nums; }
  .hist b.m { color:#b0492f; } .hist b.p { color:#2e6b52; }

  .grid { display:flex; gap:8px; }
  .fld { flex:1; }
  .fld span { display:block; font-size:11px; color:#a3a39a; margin-bottom:5px; text-align:center; }
  .fld input { width:100%; padding:10px 4px; font-size:16px; text-align:center; font-weight:600;
    border:1px solid #e2e0d9; border-radius:10px; background:#fafaf7; font-family:inherit; color:#1a1a1c; }
  .fld input:focus { outline:none; border-color:#1a1a1c; }
  .fnote { font-size:11px; color:#b5b5ad; margin-top:10px; line-height:1.6; }

  dialog { border:0; border-radius:18px; padding:18px; width:min(430px, calc(100vw - 32px)); background:#fff; color:#1a1a1c; }
  dialog::backdrop { background:rgba(26,26,28,.45); }
  canvas { width:100%; border-radius:13px; display:block; box-shadow:0 2px 12px rgba(0,0,0,.08); margin-bottom:12px; }
  .opts { display:flex; gap:8px; margin-bottom:12px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .opts .sw { width:34px; height:34px; border-radius:9px; border:2px solid transparent; cursor:pointer; }
  .opts .sw.on { border-color:#1a1a1c; }
  .opts .tog { padding:9px 14px; font-size:13px; font-weight:600; font-family:inherit;
    background:#f3f2ee; border:0; border-radius:9px; color:#57574f; cursor:pointer; }
  .opts .tog.on { background:#1a1a1c; color:#fff; }
  .hint { font-size:12px; color:#b5b5ad; text-align:center; line-height:1.6; margin:12px 0 0; }
  .status { font-size:11px; color:#b5b5ad; text-align:center; margin:14px 0 0; line-height:1.6; }
  .status.bad { color:#b0492f; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>이번 달</h2>
    <div class="burn">
      <div class="n" id="netN">0</div>
      <div class="u" id="netU">일 소모</div>
    </div>
    <div class="split">
      <div class="out"><span>쓴 날</span><b id="sOut">0</b></div>
      <div class="in"><span>번 날</span><b id="sIn">0</b></div>
      <div class="day"><span>산 날</span><b id="sDay">0</b></div>
    </div>
    <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="card">
    <h2>기록</h2>
    <div class="seg">
      <button data-k="out" class="on">썼다</button>
      <button data-k="in">벌었다</button>
    </div>
    <div class="quick" id="quick"></div>
    <div class="frow">
      <input id="amt" class="n" type="number" inputmode="decimal" placeholder="만 원">
      <input id="memo" type="text" placeholder="메모 (선택)">
    </div>
    <div class="prev" id="prev"></div>
    <button class="main" id="go" disabled>기록</button>
    <div id="log" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <h2>지난 달들</h2>
    <div id="hist"></div>
  </div>

  <div class="card">
    <h2>설정</h2>
    <div class="grid">
      <div class="fld"><span>하루 단가 (만 원)</span><input id="rate" type="number" inputmode="decimal"></div>
    </div>
    <p class="fnote">본업 벌이를 하루로 나눈 값이에요. 그래서 월급은 벌었다에 넣지 마세요. 부업, 주식, 중고 판매처럼 본업 밖에서 들어온 돈만 넣으면 됩니다.</p>
  </div>

  <button class="ghost" id="wallBtn">배경화면 만들기</button>
  <button class="ghost" id="expBtn">백업 내려받기</button>
  <button class="ghost" id="impBtn">백업 불러오기</button>
  <input type="file" id="impFile" accept="application/json" style="display:none">
  <p class="status" id="status"></p>
</div>

<dialog id="dlg">
  <div class="opts">
    <div class="sw on" data-bg="#faf9f5" data-ink="#1a1a1c" data-mute="#b5b5ad" style="background:#faf9f5"></div>
    <div class="sw" data-bg="#111112" data-ink="#f4f4f0" data-mute="#6b6b6b" style="background:#111112"></div>
    <div class="sw" data-bg="#141c2b" data-ink="#eef1f6" data-mute="#6f7c93" style="background:#141c2b"></div>
    <button class="tog on" id="tog">설명 넣기</button>
  </div>
  <canvas id="cv" width="1170" height="2532"></canvas>
  <button class="main" id="dl" style="margin-top:0">이미지 저장</button>
  <button class="ghost" id="close" style="margin-top:8px; margin-bottom:0">닫기</button>
  <p class="hint">배경화면은 저장한 순간의 숫자예요.<br>가끔 다시 저장해야 최신 숫자가 됩니다.</p>
</dialog>

<script>
(function () {
  const KEY = 'burn-days';
  let state = { spend: [], rate: 10 };
  let theme = { bg:'#faf9f5', ink:'#1a1a1c', mute:'#b5b5ad' };
  let showLabel = true;
  let kind = 'out';
  let mode = 'memory';
  const $ = id => document.getElementById(id);
  const r1 = n => Math.round(n * 10) / 10;

  async function detect() {
    if (typeof window.storage !== 'undefined' && window.storage) {
      try { await window.storage.list(''); mode = 'claude'; return; } catch (e) {}
      try { await window.storage.set(KEY + ':probe', '1'); mode = 'claude'; return; } catch (e) {}
    }
    try {
      localStorage.setItem(KEY + ':probe', '1');
      localStorage.removeItem(KEY + ':probe');
      mode = 'local';
    } catch (e) { mode = 'memory'; }
  }
  async function save() {
    try {
      const s = JSON.stringify(state);
      if (mode === 'claude') await window.storage.set(KEY, s);
      else if (mode === 'local') localStorage.setItem(KEY, s);
    } catch (e) { mode = 'memory'; showStatus(); }
  }
  async function load() {
    try {
      if (mode === 'claude') { const r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); }
      else if (mode === 'local') { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); }
    } catch (e) {}
    return null;
  }
  function showStatus() {
    const el = $('status');
    if (mode === 'memory') { el.className = 'status bad'; el.textContent = '저장이 안 되는 환경이에요. 화면을 닫으면 기록이 사라집니다.'; }
    else { el.className = 'status'; el.textContent = mode === 'local'
      ? '이 브라우저에 저장됩니다. 가끔 백업을 내려받아 두세요.' : '기록이 저장됩니다.'; }
  }

  const mKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const thisMonth = () => state.spend.filter(e => mKey(e.ts) === mKey(Date.now()));
  const sumDays = (list, k) =>
    list.filter(e => (e.kind || 'out') === k).reduce((s, e) => s + e.man, 0) / (state.rate || 1);
  const elapsed = () => new Date().getDate();

  function renderBurn() {
    const list = thisMonth();
    const out = sumDays(list, 'out'), inn = sumDays(list, 'in');
    const net = out - inn, e = elapsed();
    const over = net > e, good = net <= 0;

    $('netN').textContent = net >= 0 ? r1(net) : '+' + r1(-net);
    $('netN').className = 'n' + (good ? ' good' : over ? ' over' : '');
    $('netU').textContent = good ? '일 남김' : '일 소모';

    $('sOut').textContent = r1(out);
    $('sIn').textContent = r1(inn);
    $('sDay').textContent = e;

    const fill = $('fill');
    fill.style.width = Math.max(0, Math.min(100, net / Math.max(e, 1) * 100)) + '%';
    fill.className = 'fill' + (over ? ' over' : '');

    const v = $('verdict');
    v.className = 'verdict' + (good ? ' good' : over ? ' over' : '');
    v.innerHTML = good
      ? '쓴 것보다 <b>' + r1(-net) + '일</b>어치를 더 벌었어요'
      : '<b>' + e + '일</b> 살면서 <b>' + r1(net) + '일</b>어치를 썼어요' +
        (over ? '<br>사는 속도보다 빨라요' : '');
  }

  function renderLog() {
    const box = $('log');
    const list = thisMonth();
    if (!list.length) { box.innerHTML = '<div class="empty">이번 달 기록이 없어요</div>'; return; }
    box.innerHTML = '';
    list.slice().reverse().forEach(e => {
      const plus = (e.kind || 'out') === 'in';
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = '<div class="it-main"><div class="it-t"></div><div class="it-d"></div></div>' +
        '<div class="it-n ' + (plus ? 'p' : 'm') + '">' + (plus ? '+' : '−') +
        r1(e.man / (state.rate || 1)) + '일</div><button class="x">×</button>';
      row.querySelector('.it-t').textContent = e.memo || (e.man + '만 원');
      const dt = new Date(e.ts);
      row.querySelector('.it-d').textContent = (dt.getMonth()+1) + '월 ' + dt.getDate() + '일 · ' + e.man + '만 원';
      row.querySelector('.x').addEventListener('click', async () => {
        state.spend = state.spend.filter(x => x.id !== e.id);
        await save(); renderAll();
      });
      box.appendChild(row);
    });
  }

  function renderHist() {
    const box = $('hist');
    const cur = mKey(Date.now());
    const map = {};
    state.spend.forEach(e => {
      const k = mKey(e.ts);
      if (k === cur) return;
      if (!map[k]) map[k] = { out: 0, in: 0 };
      map[k][(e.kind || 'out')] += e.man;
    });
    const keys = Object.keys(map).sort().reverse().slice(0, 6);
    if (!keys.length) { box.innerHTML = '<div class="empty">아직 없어요</div>'; return; }
    box.innerHTML = '';
    keys.forEach(k => {
      const parts = k.split('-');
      const dim = new Date(+parts[0], +parts[1], 0).getDate();
      const net = (map[k].out - map[k].in) / (state.rate || 1);
      const d = document.createElement('div');
      d.className = 'hist';
      d.innerHTML = '<span>' + (+parts[1]) + '월</span>' +
        (net <= 0
          ? '<b class="p">+' + r1(-net) + '일</b>'
          : '<b class="m">' + r1(net) + ' / ' + dim + '일</b>');
      box.appendChild(d);
    });
  }

  function preview() {
    const v = parseFloat($('amt').value);
    if (!v || v <= 0) { $('prev').innerHTML = ''; $('go').disabled = true; return; }
    const d = r1(v / (state.rate || 1));
    $('prev').innerHTML = kind === 'in'
      ? '<b class="g">+' + d + '일</b>어치'
      : '내 <b>' + d + '일</b>어치';
    $('go').disabled = false;
  }

  function buildQuick() {
    const vals = kind === 'in' ? [5, 10, 30, 50] : [1, 3, 5, 10];
    $('quick').innerHTML = '';
    vals.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v + '만';
      b.addEventListener('click', () => {
        $('amt').value = (parseFloat($('amt').value) || 0) + v;
        preview();
      });
      $('quick').appendChild(b);
    });
  }

  function drawWall() {
    const cv = $('cv'), ctx = cv.getContext('2d');
    const F = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
    ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, 1170, 2532);
    ctx.textAlign = 'center';

    const list = thisMonth();
    const net = sumDays(list, 'out') - sumDays(list, 'in');
    const e = elapsed();
    const good = net <= 0;
    const txt = good ? '+' + r1(-net) : String(r1(net));

    const y = 1120;
    if (showLabel) {
      ctx.fillStyle = theme.mute; ctx.font = '600 46px ' + F;
      ctx.fillText(good ? '이번 달 남긴 날' : '이번 달 쓴 날', 585, y - 130);
    }
    ctx.fillStyle = good ? '#2e6b52' : theme.ink;
    ctx.font = '800 230px ' + F;
    ctx.fillText(txt, 585, y + 80);

    ctx.fillStyle = theme.mute;
    if (showLabel) { ctx.font = '500 52px ' + F; ctx.fillText('살아온 날 ' + e, 585, y + 200); }
    else { ctx.font = '600 66px ' + F; ctx.fillText(e, 585, y + 200); }

    const w = 470, x = 585 - w / 2, by = y + 300;
    ctx.fillStyle = theme.mute; ctx.globalAlpha = .28;
    ctx.beginPath(); ctx.roundRect(x, by, w, 12, 6); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = good ? '#2e6b52' : (net > e ? '#b0492f' : theme.ink);
    const fw = Math.max(6, Math.min(w, Math.abs(net) / Math.max(e, 1) * w));
    ctx.beginPath(); ctx.roundRect(x, by, fw, 12, 6); ctx.fill();
  }

  function renderAll() { renderBurn(); renderLog(); renderHist(); preview(); drawWall(); }

  $('amt').addEventListener('input', preview);
  document.querySelectorAll('.seg button').forEach(b =>
    b.addEventListener('click', () => {
      document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); kind = b.dataset.k;
      buildQuick(); preview();
    })
  );
  $('go').addEventListener('click', async () => {
    const v = parseFloat($('amt').value);
    if (!v || v <= 0) return;
    state.spend.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      man: v, kind, memo: $('memo').value.trim(), ts: Date.now() });
    $('amt').value = ''; $('memo').value = '';
    await save(); renderAll();
  });
  $('rate').addEventListener('input', async () => {
    const v = parseFloat($('rate').value);
    if (isNaN(v) || v <= 0) return;
    state.rate = v; await save(); renderAll();
  });

  $('wallBtn').addEventListener('click', () => { drawWall(); $('dlg').showModal(); });
  $('close').addEventListener('click', () => $('dlg').close());
  $('tog').addEventListener('click', () => {
    showLabel = !showLabel;
    $('tog').classList.toggle('on', showLabel);
    $('tog').textContent = showLabel ? '설명 넣기' : '숫자만';
    drawWall();
  });
  document.querySelectorAll('.opts .sw').forEach(s =>
    s.addEventListener('click', () => {
      document.querySelectorAll('.opts .sw').forEach(x => x.classList.remove('on'));
      s.classList.add('on');
      theme = { bg: s.dataset.bg, ink: s.dataset.ink, mute: s.dataset.mute };
      drawWall();
    })
  );
  $('dl').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'wallpaper.png'; a.href = $('cv').toDataURL('image/png'); a.click();
  });

  $('expBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'burn-backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('impBtn').addEventListener('click', () => $('impFile').click());
  $('impFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (d && Array.isArray(d.spend)) {
          state = Object.assign({ spend: [], rate: 10 }, d);
          $('rate').value = state.rate;
          await save(); renderAll();
        }
      } catch (err) {}
      e.target.value = '';
    };
    r.readAsText(file);
  });

  (async () => {
    await detect();
    const saved = await load();
    if (saved && Array.isArray(saved.spend)) state = Object.assign(state, saved);
    $('rate').value = state.rate || 10;
    buildQuick();
    showStatus();
    renderAll();
  })();
})();
</script>
</body>
</html>
